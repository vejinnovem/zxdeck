<svg xmlns="http://www.w3.org/2000/svg" width="240" height="320" viewBox="0 0 240 320">
  <rect width="240" height="320" fill="#000000"/>

  <!-- ZX Spectrum-inspired four-colour ribbon. Intentionally vector so the
       repository preview is lossless and the design scales cleanly. -->
  <g shape-rendering="crispEdges">
    <polygon points="0,320 28,320 194,0 166,0" fill="#ff1b17"/>
    <polygon points="28,320 56,320 222,0 194,0" fill="#ffd91a"/>
    <polygon points="56,320 84,320 240,20 240,74" fill="#25c842"/>
    <polygon points="84,320 112,320 240,74 240,128" fill="#24a9e8"/>
  </g>

  <!-- Dark panel keeps the wordmark perfectly horizontal and readable. -->
  <rect x="12" y="126" width="216" height="68" rx="2" fill="#000000"/>
  <text x="120" y="168"
        text-anchor="middle"
        dominant-baseline="middle"
        fill="#ffffff"
        font-family="monospace"
        font-size="34"
        font-weight="700"
        letter-spacing="-2">ZX Deck</text>
</svg>
