[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "zxdeck"
version = "0.1.0"
description = "Digital tape recorder/player backend for ZX Spectrum computers"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

